<!DOCTYPE html>
<html lang="de">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mal</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="app">
  <aside id="sidebar">
    <div id="levelButtonsWrap">
      <button class="lvlBtn active" data-level="1">L1</button>
      <button class="lvlBtn" data-level="2">L2</button>
      <button class="lvlBtn" data-level="3">L3</button>
      <button class="lvlBtn" data-level="4">L4</button>
      <button class="lvlBtn" data-level="5">L5</button>
      <button class="lvlBtn" data-level="6">L6</button>
      <button class="lvlBtn" data-level="7">L7</button>
      <button class="lvlBtn" data-level="8">L8</button>
      <button class="lvlBtn" data-level="9">L9</button>
    </div>
  </aside>

  <main id="main">
    <header id="topCenter">
      <div id="countsWrap">
        <div class="countBox countOk">✓ <span id="okCount">0</span></div>
        <div class="countBox countBad">✗ <span id="badCount">0</span></div>
      </div>
    </header>

    <div id="playArea">
      <section id="animArea" aria-label="Animation">
        <div id="pointsWrap" class="pointsWrap">
          <div id="pointsField" class="pointsField" aria-label="Hunderterfeld"></div>

          <div id="redFrame" class="redFrame" aria-hidden="true"></div>

          <div id="labelA" class="coreLabel" aria-hidden="true"></div>
          <div id="labelB" class="coreLabel" aria-hidden="true"></div>
        </div>
      </section>

      <section id="taskArea" aria-label="Aufgabe">
      <div class="taskRow">
        <div id="taskText" class="taskText">–</div>
        <div class="eq">=</div>
        <input id="answerInput" class="answerInput" inputmode="numeric" autocomplete="off" />
      </div>

      <div class="keypad" aria-label="Ziffernfeld">
        <button class="keyBtn" data-key="1">1</button><button class="keyBtn" data-key="2">2</button><button class="keyBtn" data-key="3">3</button>
        <button class="keyBtn" data-key="4">4</button><button class="keyBtn" data-key="5">5</button><button class="keyBtn" data-key="6">6</button>
        <button class="keyBtn" data-key="7">7</button><button class="keyBtn" data-key="8">8</button><button class="keyBtn" data-key="9">9</button>
        <button class="keyBtn utilityKey" data-key="clear">C</button><button class="keyBtn" data-key="0">0</button><button class="keyBtn utilityKey" data-key="back">⌫</button>
      </div>
        <div class="controlsRow">
          <button id="nextBtn" class="ctrlBtn" title="Nächste Aufgabe">▶</button>
          <button id="resetBtn" class="ctrlBtn" title="Reset">⟲</button>
        </div>
      </section>
    </div>
  </main>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
