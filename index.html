<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Mal – Einmaleins-Lernspiel</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header class="dk-topbar" id="levelButtonsWrap" role="group" aria-label="Stufe wählen">
      <button class="dk-lvl lvlBtn active" type="button" data-level="1"><span class="dk-lvl-main">Kern</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="2"><span class="dk-lvl-main">Kern Mix</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="3"><span class="dk-lvl-main">3er</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="4"><span class="dk-lvl-main">4er</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="5"><span class="dk-lvl-main">6er</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="6"><span class="dk-lvl-main">8er</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="7"><span class="dk-lvl-main">7er</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="8"><span class="dk-lvl-main">9er</span></button>
      <button class="dk-lvl lvlBtn" type="button" data-level="9"><span class="dk-lvl-main">Mal Mix</span></button>
  </header>

  <main id="game">
    <section id="animArea" class="board-panel" aria-label="Hunderterfeld und Animation">
      <div id="pointsWrap" class="pointsWrap">
        <div id="pointsField" class="pointsField" aria-label="Hunderterfeld"></div>
        <div id="redFrame" class="redFrame" aria-hidden="true"></div>
        <div id="redFrame2" class="redFrame" aria-hidden="true"></div>
        <div id="labelA" class="coreLabel" aria-hidden="true"></div>
        <div id="labelB" class="coreLabel" aria-hidden="true"></div>
      </div>
    </section>

    <section id="taskArea" class="work-panel" aria-label="Aufgabe">
      <div id="progressDots" class="dk-progress"></div>
      <div class="taskRow">
        <div id="taskText" class="taskText">–</div>
        <div class="eq">=</div>
        <input id="answerInput" class="answerInput" aria-label="Ergebnis" inputmode="none" autocomplete="off" readonly tabindex="-1">
      </div>
    </section>
  </main>

  <section id="resultPanel" class="result-panel" hidden aria-live="polite"></section>

  <div class="dk-keyrow" id="keypad" aria-label="Ziffernfeld"><button class="dk-key keyBtn" type="button" data-key="1">1</button><button class="dk-key keyBtn" type="button" data-key="2">2</button><button class="dk-key keyBtn" type="button" data-key="3">3</button><button class="dk-key keyBtn" type="button" data-key="4">4</button><button class="dk-key keyBtn" type="button" data-key="5">5</button><button class="dk-key keyBtn" type="button" data-key="6">6</button><button class="dk-key keyBtn" type="button" data-key="7">7</button><button class="dk-key keyBtn" type="button" data-key="8">8</button><button class="dk-key keyBtn" type="button" data-key="9">9</button><button class="dk-key keyBtn" type="button" data-key="0">0</button><button class="dk-key dk-del keyBtn" type="button" data-key="back" aria-label="Letzte Ziffer löschen">⌫</button></div>
  <nav class="dk-bottombar" aria-label="Steuerung">
    <div class="dk-bb-left">
      <button id="animBtn" class="dk-ctrl dk-anim active" type="button" title="Animation ausschalten" aria-label="Animation ein- oder ausschalten" aria-pressed="true"><svg class="animIcon" viewBox="0 0 44 40" width="44" height="40" aria-hidden="true"><rect x="4" y="3" width="9" height="34" rx="2" fill="#bfdbfe" stroke="#6b9dd8" stroke-width="1.5"/><line x1="4" x2="13" y1="6.4" y2="6.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="9.8" y2="9.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="13.2" y2="13.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="16.6" y2="16.6" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="20.0" y2="20.0" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="23.4" y2="23.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="26.8" y2="26.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="30.2" y2="30.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="33.6" y2="33.6" stroke="#6b9dd8" stroke-width="0.8"/><rect x="17" y="3" width="9" height="34" rx="2" fill="#bfdbfe" stroke="#6b9dd8" stroke-width="1.5"/><line x1="17" x2="26" y1="6.4" y2="6.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="9.8" y2="9.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="13.2" y2="13.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="16.6" y2="16.6" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="20.0" y2="20.0" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="23.4" y2="23.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="26.8" y2="26.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="30.2" y2="30.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="33.6" y2="33.6" stroke="#6b9dd8" stroke-width="0.8"/><rect x="31" y="3" width="9" height="9" rx="2" fill="#bbf7d0" stroke="#65a887" stroke-width="1.5"/><rect x="31" y="14" width="9" height="9" rx="2" fill="#bbf7d0" stroke="#65a887" stroke-width="1.5"/><rect x="31" y="25" width="9" height="9" rx="2" fill="#bbf7d0" stroke="#65a887" stroke-width="1.5"/><line class="animStrike" x1="2" y1="38" x2="42" y2="2" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/></svg></button>
    </div>
    <div class="dk-bb-mid">
      <button id="fullscreenBtn" class="dk-ctrl" type="button" title="Vollbild" aria-label="Im Vollbild spielen"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#263445" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="dk-bb-right">
      <button id="endRoundBtn" class="dk-ctrl" type="button" title="Runde beenden" aria-label="Runde beenden">Ende</button>
      <button id="homeBtn" class="dk-ctrl" type="button" title="Zur Übersicht" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2" fill="none" stroke="#263445" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10" fill="none" stroke="#263445" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
    </div>
  </nav>
</div>
<script src="./script.js"></script>
</body>
</html>
